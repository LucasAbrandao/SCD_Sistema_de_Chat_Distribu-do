name: ${COMPOSE_PROJECT_NAME:-scd}
x-service: &service
  init: true
  restart: unless-stopped
  healthcheck:
    test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  depends_on:
    migrate:
      condition: service_completed_successfully
x-auth: &auth
  <<: *service
  build: { context: ., target: auth }
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dauth
    JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
    JWT_ISSUER: scd-auth
    JWT_AUDIENCE: scd-chat
    REGISTRATION_ENABLED: 'false'
  secrets: [jwt_private]
x-chat: &chat
  <<: *service
  build: { context: ., target: chat }
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dchat
    REDIS_URL: redis://redis:6379
    AUTH_INTERNAL_URL: http://auth-1:3000
    JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
    JWT_ISSUER: scd-auth
    JWT_AUDIENCE: scd-chat
  secrets: [jwt_public]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Execute npm run setup}
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4.6-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    image: postgres:17.6-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./services/auth/migrations:/migrations/auth:ro
      - ./services/chat/migrations:/migrations/chat:ro
    command: [sh, -ec, 'psql -v ON_ERROR_STOP=1 -f /migrations/auth/001_schema.sql && psql -v ON_ERROR_STOP=1 -f /migrations/chat/001_schema.sql']
  auth-1: *auth
  auth-2: *auth
  chat-1: *chat
  chat-2: *chat
  web:
    build: { context: ., target: web }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 6
  traefik:
    image: traefik:v3.6.1
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/routes.yaml
      - --ping=true
    ports: ['127.0.0.1:${PORT:-8080}:80']
    volumes: ['./infra/routes.yaml:/etc/traefik/routes.yaml:ro']
    depends_on:
      auth-1: { condition: service_healthy }
      auth-2: { condition: service_healthy }
      chat-1: { condition: service_healthy }
      chat-2: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  postgres-data:
secrets:
  jwt_private: { file: ./secrets/jwt-private.pem }
  jwt_public: { file: ./secrets/jwt-public.pem }
